[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexarth"
version = "0.1.0"
description = "Python library, CLI and phone control app for the Waveshare HexArth hexapod"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
hexarth = "hexarth.cli:main"

[tool.setuptools]
packages = ["hexarth"]

[tool.setuptools.package-data]
hexarth = ["web/*.html"]
